name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Tier 0: the cheap tests ─────────────────────────────────────────────
  # These need no browser and no network, so they finish in well under a
  # minute. They also hold the majority of the assertions in the repo, which
  # is the right way round: the further down the pyramid a test sits, the
  # faster it runs and the more precisely it names what broke.

  # 370 tests: unit tests over the schemas and pricing rules, and API tests
  # that drive real HTTP through the real Express app against a real MongoDB.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # backend/ has its own package.json and its own lockfile — this is
          # what tells the cache which dependency tree it is caching.
          cache-dependency-path: backend/package-lock.json

      # The tests spin up a genuine mongod process in memory rather than
      # mocking the driver, because the behaviour worth testing (the atomic
      # stock decrement that stops two shoppers buying the same last unit)
      # is a guarantee made by MongoDB, not by our JavaScript. A mock would
      # only ever return what we told it to.
      #
      # That means mongodb-memory-server has to fetch a ~70MB mongod binary.
      # Downloading it on every run would add roughly a minute each time and
      # make the pipeline fail whenever the download host has a bad day, so
      # it is cached. The key is tied to the lockfile: bump the library and
      # the key changes, so a stale binary can never be reused silently.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      # `npm ci` rather than `npm install`: it installs exactly the versions
      # in the lockfile and errors if package.json and the lockfile disagree.
      # `npm install` would quietly resolve newer versions, which is how CI
      # ends up testing a dependency tree nobody has on their machine.
      - name: Install dependencies
        run: npm ci

      # No secrets and no .env needed. Vitest sets NODE_ENV=test, and
      # config/env.js skips loading .env in test mode — so CI runs the exact
      # same code path a developer runs locally.
      - name: Run backend tests
        run: npm test

  # 10 tests. Tiny for now — stage 5 grows this into the component suite.
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Note this is `npm test` (Vitest, in jsdom), NOT `npm run test:e2e`
      # (Playwright, in a real browser). Two different runners live in this
      # folder and they take different dialects — see the comment at the top
      # of tests/unit/harness.test.jsx.
      - name: Run frontend unit tests
        run: npm test

  # Playwright driving the API over a real socket: 13 tests against a real
  # Express server on a real port, backed by a throwaway in-memory MongoDB.
  # Covers what in-process testing cannot — that the server actually starts,
  # that session cookies survive a round trip, and that helmet's security
  # headers reach the wire.
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      # Same mongod binary as backend-tests, same cache. The server this suite
      # talks to boots its own in-memory MongoDB — see
      # backend/scripts/test-server.js.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      # The backend's dependencies too: Playwright starts `npm run test:server`
      # in ../backend, which needs express and mongodb-memory-server present.
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # NOTE: no `playwright install`. These tests use the `request` fixture,
      # which speaks HTTP from Node and never launches a browser — so the
      # ~400MB of browser binaries the other jobs download are not needed here.
      # That is most of why this job is the fastest of the Playwright three.
      - name: Run API tests
        run: npm run test:api

      - name: Upload Playwright report (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: frontend-react/playwright-report-api/
          retention-days: 14

  # ── Tier 2: the whole stack ─────────────────────────────────────────────
  # The real production bundle, served by a real Express server, backed by a
  # real (throwaway) MongoDB, driven by a real browser. The only job here where
  # nothing at all is stubbed.
  #
  # It catches what lives BETWEEN the pieces: a production build that breaks
  # something working in dev, a session cookie a browser refuses, a deep link
  # that 404s on refresh, a frontend and backend disagreeing about a shape.
  fullstack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # Chromium only. The default browser suite already covers Firefox and
      # WebKit for rendering differences; what this job adds is the real
      # backend, which behaves the same whichever engine asks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Builds the bundle into backend/public, then runs. The build is a
      # separate step inside the npm script rather than inside Playwright's
      # webServer, so a broken build reports as a broken build instead of as
      # "server failed to start".
      - name: Build and run full-stack E2E
        run: npm run test:fullstack

      - name: Upload Playwright report (fullstack)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fullstack
          path: frontend-react/playwright-report-fullstack/
          retention-days: 14

  # ── Tier 1: the browser tests ───────────────────────────────────────────
  # Fast tier — the small set of critical happy-path checks. Runs on every
  # single push, so it gives near-instant feedback without slowing down
  # the commit-and-push loop as the full suite grows.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # package.json, playwright.config.js, and tests/ all live inside the
    # frontend-react subfolder, not at the repo root — this makes every
    # `run:` step below execute from there instead of the checkout root.
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: npx playwright test --grep @smoke
        env:
          CI: true
          # Without .env (which never reaches CI), the app defaults to
          # product.service.remote.js, which tries to fetch from a backend
          # that doesn't exist here — causing every search/product query to
          # silently return empty. Forcing local mode matches how the app
          # actually runs for a frontend-only test suite.
          VITE_LOCAL: true

      - name: Upload Playwright report (smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: frontend-react/playwright-report/
          retention-days: 14

  # Full tier — everything else: negatives, edge cases, slower/more detailed
  # flows. Only runs on pull requests, so it doesn't slow down every small
  # push but still gates anything before it actually merges into main.
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression tests
        run: npx playwright test --grep @regression
        env:
          CI: true
          VITE_LOCAL: true

      - name: Upload Playwright report (regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression
          path: frontend-react/playwright-report/
          retention-days: 14

  # Safety net — catches any test that wasn't tagged @smoke or @regression.
  # Without this, an untagged test silently never runs in CI at all, since
  # --grep only matches tagged tests. Runs on every push/PR, same as smoke,
  # so a forgotten tag surfaces immediately rather than going unnoticed.
  untagged:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run untagged tests
        run: npx playwright test --grep-invert "@smoke|@regression" --pass-with-no-tests
        env:
          CI: true
          VITE_LOCAL: true

      - name: Upload Playwright report (untagged)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-untagged
          path: frontend-react/playwright-report/
          retention-days: 14

  # ── CD starts here ──────────────────────────────────────────────────
  # Both build and deploy are unchanged from the original working
  # deploy-only workflow, except for two additions: `needs` (so this only
  # runs after tests pass) and `if` (to replicate what used to be handled
  # implicitly by the old workflow's own separate `on: push: branches:
  # ["main"]` trigger, now that the top-level trigger above is broader).

  build:
    # `needs` is the gate. Every job listed here must go green before the
    # build starts, and if any one fails the build is skipped — so a broken
    # backend can no longer reach production just because the browser tests
    # happened to pass.
    #
    # `regression` is deliberately absent: it only runs on pull requests, and
    # a job that never ran counts as "not satisfied", which would block every
    # deploy permanently.
    needs: [backend-tests, frontend-unit, api-tests, fullstack-tests, smoke, untagged]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: true
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - run: npm ci
      - run: npm run build:github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-react/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4